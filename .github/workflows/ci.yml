name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Go test
        run: go test ./...

      - name: Docker smoke test
        run: |
          docker build -t mcp-smoke .
          docker run --rm mcp-smoke

  agent-e2e:
    runs-on: ubuntu-latest
    needs: build
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Run live agent e2e
        if: ${{ env.OPENAI_API_KEY != '' }}
        run: ./scripts/agent-e2e.sh

      - name: Skip live agent e2e when no secret is configured
        if: ${{ env.OPENAI_API_KEY == '' }}
        run: echo "Skipping agent e2e because OPENAI_API_KEY is not configured."
